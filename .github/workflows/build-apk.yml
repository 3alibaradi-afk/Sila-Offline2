name: Build Sila APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
        - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q SilaOfflineMVP1-GitHubReady.zip -d extracted
          ls -la extracted/SilaOfflineMVP1

      - name: Set compatible minSdk
        run: |
          sed -i 's/minSdk = 23/minSdk = 24/' extracted/SilaOfflineMVP1/app/build.gradle.kts
          grep "minSdk" extracted/SilaOfflineMVP1/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
          
      - name: Build APK
        working-directory: extracted/SilaOfflineMVP1
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sila-Offline-APK
          path: extracted/SilaOfflineMVP1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
